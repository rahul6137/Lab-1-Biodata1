<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Biodata Form</h1>
        <p>Please fill in your complete information accurately</p>
    </div>
    <div class="form-content">
        <form id="biodataForm">
            <div class="form-section">
                <h2 class="section-title">Personal Information</h2>
                <div class="personal-info-wrapper">
                    <div class="personal-info-fields">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name *</label>
                                <input type="text" id="firstName" name="firstName">
                                <small class="error-message"></small>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name *</label>
                                <input type="text" id="lastName" name="lastName">
                                <small class="error-message"></small>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="fatherName">Father's Name *</label>
                                <input type="text" id="fatherName" name="fatherName">
                                <small class="error-message"></small>
                            </div>
                            <div class="form-group">
                                <label for="motherName">Mother's Name *</label>
                                <input type="text" id="motherName" name="motherName">
                                <small class="error-message"></small>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Gender *</label>
                            <div class="radio-group">
                                <div class="radio-item">
                                    <input type="radio" id="male" name="gender" value="male">
                                    <label for="male">Male</label>
                                </div>
                                <div class="radio-item">
                                    <input type="radio" id="female" name="gender" value="female">
                                    <label for="female">Female</label>
                                </div>
                                <div class="radio-item">
                                    <input type="radio" id="other" name="gender" value="other">
                                    <label for="other">Other</label>
                                </div>
                            </div>
                            <small class="error-message"></small>
                        </div>

                        <div class="form-row-3">
                            <div class="form-group">
                                <label for="dob">Date of Birth *</label>
                                <input type="date" id="dob" name="dob">
                                <small class="error-message"></small>
                            </div>
                            <div class="form-group">
                                <label for="age">Age</label>
                                <input type="number" id="age" name="age" min="1" max="120">
                            </div>
                            <div class="form-group">
                                <label for="bloodGroup">Blood Group</label>
                                <select id="bloodGroup" name="bloodGroup">
                                    <option value="">Select</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="nationality">Nationality *</label>
                                <select id="nationality" name="nationality">
                                    <option value="">Select Nationality</option>
                                    <option value="bangladeshi">Bangladeshi</option>
                                    <option value="indian">Indian</option>
                                    <option value="pakistani">Pakistani</option>
                                    <option value="american">American</option>
                                    <option value="british">British</option>
                                    <option value="other">Other</option>
                                </select>
                                <small class="error-message"></small>
                            </div>
                            <div class="form-group">
                                <label for="religion">Religion</label>
                                <select id="religion" name="religion">
                                    <option value="">Select Religion</option>
                                    <option value="islam">Islam</option>
                                    <option value="hinduism">Hinduism</option>
                                    <option value="christianity">Christianity</option>
                                    <option value="buddhism">Buddhism</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="presentAddress">Present Address *</label>
                                <textarea id="presentAddress" name="presentAddress"></textarea>
                                <small class="error-message"></small>
                            </div>
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city">
                                <small class="error-message"></small>
                            </div>
                        </div>
                    </div>

                    <div class="photo-upload-box">
                        <div class="photo-badge">📸 PHOTO</div>
                        <label for="photo" class="photo-preview-container">
                            <div class="upload-placeholder">
                                <div class="upload-icon">👤</div>
                                <div class="upload-text">Upload Photo</div>
                                <div class="upload-hint">Click to browse<br>JPG, PNG (Max 5MB)</div>
                            </div>
                            <img id="photoPreview" class="photo-preview" alt="Photo Preview">
                            <button type="button" class="photo-change-btn" id="changePhotoBtn">Change Photo</button>
                            <input type="file" id="photo" name="photo" accept="image/*">
                            <small class="error-message"></small>
                        </label>
                    </div>
                </div>
            </div>

            <div class="btn-container">
                <button type="submit" class="btn-submit">Submit Form</button>
                <button type="reset" class="btn-reset">Reset Form</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
