<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Biodata Form</h1>
            <p>Please fill in your complete information accurately</p>
        </div>

        <div class="form-content">
            <form id="biodataForm">
                <!-- Personal Information with Photo -->
                <div class="form-section">
                    <h2 class="section-title">Personal Information</h2>
                    
                    <div class="personal-info-wrapper">
                        <!-- Personal Info Fields -->
                        <div class="personal-info-fields">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="firstName">First Name *</label>
                                    <input type="text" id="firstName" name="firstName" required>
                                </div>
                                <div class="form-group">
                                    <label for="lastName">Last Name *</label>
                                    <input type="text" id="lastName" name="lastName" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="fatherName">Father's Name *</label>
                                    <input type="text" id="fatherName" name="fatherName" required>
                                </div>
                                <div class="form-group">
                                    <label for="motherName">Mother's Name *</label>
                                    <input type="text" id="motherName" name="motherName" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Gender *</label>
                                <div class="radio-group">
                                    <div class="radio-item">
                                        <input type="radio" id="male" name="gender" value="male" required>
                                        <label for="male">Male</label>
                                    </div>
                                    <div class="radio-item">
                                        <input type="radio" id="female" name="gender" value="female">
                                        <label for="female">Female</label>
                                    </div>
                                    <div class="radio-item">
                                        <input type="radio" id="other" name="gender" value="other">
                                        <label for="other">Other</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-row-3">
                                <div class="form-group">
                                    <label for="dob">Date of Birth *</label>
                                    <input type="date" id="dob" name="dob" required>
                                </div>
                                <div class="form-group">
                                    <label for="age">Age</label>
                                    <input type="number" id="age" name="age" min="1" max="120">
                                </div>
                                <div class="form-group">
                                    <label for="bloodGroup">Blood Group</label>
                                    <select id="bloodGroup" name="bloodGroup">
                                        <option value="">Select</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="nationality">Nationality *</label>
                                    <select id="nationality" name="nationality" required>
                                        <option value="">Select Nationality</option>
                                        <option value="bangladeshi">Bangladeshi</option>
                                        <option value="indian">Indian</option>
                                        <option value="pakistani">Pakistani</option>
                                        <option value="american">American</option>
                                        <option value="british">British</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="religion">Religion</label>
                                    <select id="religion" name="religion">
                                        <option value="">Select Religion</option>
                                        <option value="islam">Islam</option>
                                        <option value="hinduism">Hinduism</option>
                                        <option value="christianity">Christianity</option>
                                        <option value="buddhism">Buddhism</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="maritalStatus">Marital Status</label>
                                    <select id="maritalStatus" name="maritalStatus">
                                        <option value="">Select Status</option>
                                        <option value="single">Single</option>
                                        <option value="married">Married</option>
                                        <option value="divorced">Divorced</option>
                                        <option value="widowed">Widowed</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="nid">National ID / Passport No</label>
                                    <input type="text" id="nid" name="nid">
                                </div>
                            </div>

                            <div class="form-group">
                        <label>Hobbies</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="skill1" name="skills" value="programming">
                                <label for="skill1">Programming</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="skill2" name="skills" value="design">
                                <label for="skill2">Design</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="skill3" name="skills" value="management">
                                <label for="skill3">Management</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="skill4" name="skills" value="communication">
                                <label for="skill4">Communication</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="skill5" name="skills" value="leadership">
                                <label for="skill5">Leadership</label>
                            </div>
                        </div>
                    </div>
                        </div>
                        <div class="photo-upload-box">
                            <div class="photo-badge">📸 PHOTO</div>
                            <label for="photo" class="photo-preview-container">
                                <div class="upload-placeholder">
                                    <div class="upload-icon">👤</div>
                                    <div class="upload-text">Upload Photo</div>
                                    <div class="upload-hint">Click to browse<br>JPG, PNG (Max 5MB)</div>
                                </div>
                                <img id="photoPreview" class="photo-preview" alt="Photo Preview">
                                <button type="button" class="photo-change-btn" id="changePhotoBtn">Change Photo</button>
                                <input type="file" id="photo" name="photo" accept="image/*">
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <h2 class="section-title">Contact Information</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="alternatePhone">Alternate Phone</label>
                            <input type="tel" id="alternatePhone" name="alternatePhone">
                        </div>
                        <div class="form-group">
                            <label for="emergencyContact">Emergency Contact</label>
                            <input type="tel" id="emergencyContact" name="emergencyContact">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="presentAddress">Present Address *</label>
                        <textarea id="presentAddress" name="presentAddress" required></textarea>
                    </div>

                    <div class="form-row-3">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="state">State/Division</label>
                            <input type="text" id="state" name="state">
                        </div>
                        <div class="form-group">
                            <label for="zipcode">Zip Code</label>
                            <input type="text" id="zipcode" name="zipcode">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="permanentAddress">Permanent Address</label>
                        <textarea id="permanentAddress" name="permanentAddress"></textarea>
                    </div>
                </div>
                <div class="form-section">
                    <h2 class="section-title">Educational Background</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="qualification">Highest Qualification *</label>
                            <select id="qualification" name="qualification" required>
                              <option value="">Select Qualification</option>
                                <option value="highschool">High School</option>
                                <option value="diploma">Diploma</option>
                                <option value="bachelor">Bachelor's Degree</option>
                                <option value="master">Master's Degree</option>
                                <option value="phd">PhD</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="fieldOfStudy">Field of Study *</label>
                            <input type="text" id="fieldOfStudy" name="fieldOfStudy" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="institution">Institution Name *</label>
                            <input type="text" id="institution" name="institution" required>
                        </div>
                        <div class="form-group">
                            <label for="passingYear">Year of Passing</label>
                            <input type="number" id="passingYear" name="passingYear" min="1950" max="2030">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="grade">Grade/CGPA</label>
                            <input type="text" id="grade" name="grade">
                        </div>
                        <div class="form-group">
                            <label for="board">Board/University</label>
                            <input type="text" id="board" name="board">
                        </div>
                    </div>

                    

                    <div class="form-group">
                        <label for="languages">Languages Known</label>
                        <input type="text" id="languages" name="languages" placeholder="e.g., English, Bengali, Hindi">
                    </div>
                </div>
                <div class="form-section">
                    <h2 class="section-title">Professional Information</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="occupation">Occupation</label>
                            <input type="text" id="occupation" name="occupation">
                        </div>
                        <div class="form-group">
                            <label for="designation">Designation</label>
                            <input type="text" id="designation" name="designation">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="organization">Organization/Company</label>
                            <input type="text" id="organization" name="organization">
                        </div>
                        <div class="form-group">
                            <label for="experience">Years of Experience</label>
                            <input type="number" id="experience" name="experience" min="0" max="50">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="salary">Current Salary (Optional)</label>
                            <input type="text" id="salary" name="salary">
                        </div>
                        <div class="form-group">
                            <label for="website">LinkedIn/Website</label>
                            <input type="url" id="website" name="website" placeholder="https://">
                        </div>
                    </div>
                </div>
                <div class="btn-container">
                    <button type="submit" class="btn-submit">Submit Form</button>
                    <button type="reset" class="btn-reset">Reset Form</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('biodataForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Form submitted successfully! (This is a demo)');
        });
        const photoInput = document.getElementById('photo');
        const photoPreview = document.getElementById('photoPreview');
        const uploadPlaceholder = document.querySelector('.upload-placeholder');
        const changePhotoBtn = document.getElementById('changePhotoBtn');

        photoInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    photoPreview.src = event.target.result;
                    photoPreview.style.display = 'block';
                    uploadPlaceholder.style.display = 'none';
                    changePhotoBtn.style.display = 'block';
                }
                
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        changePhotoBtn.addEventListener('click', function(e) {
            e.preventDefault();
            photoInput.click();
        });
    </script>
</body>
</html>
